<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pouet Panda</title>
<meta name="description" content="Pouet Panda, un jeu web open source d'OpenGamingStudio : un panda vole en pétant entre les bambous. Un appui, un pouet !">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#FF4F9A">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script type="module" src="/src/main.ts"></script>
</head>
<body class="font-sans">
<div id="app" class="fixed inset-0 overflow-hidden">
  <canvas id="stage" class="absolute inset-0 h-full w-full touch-none" aria-label="Plateau de jeu : touche pour péter" role="img"></canvas>

  <!-- Partie : score, pièces, pause -->
  <div id="hud" hidden class="pointer-events-none absolute inset-x-0 top-0 flex justify-center pt-[max(0.75rem,env(safe-area-inset-top))] pl-[max(0.75rem,env(safe-area-inset-left))] pr-[max(0.75rem,env(safe-area-inset-right))]">
  <div class="flex w-[min(100%,calc(100dvh*9/16))] items-start justify-between px-3">
    <div class="chip" aria-label="Pièces de la partie">
      <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#FFD60A" stroke="#16110F" stroke-width="3"/><path d="M12 7v10" stroke="#16110F" stroke-width="3" stroke-linecap="round"/></svg>
      <span id="hud-coins">0</span>
    </div>
    <div class="flex items-center gap-2">
      <div id="hud-score" class="score text-6xl leading-none" aria-live="off" aria-label="Score">0</div>
      <svg id="hud-ice" hidden class="h-9 w-9" viewBox="0 0 24 24" aria-label="Bouclier de glace"><circle cx="12" cy="12" r="11" fill="#C8F0FF" stroke="#16110F" stroke-width="2.5"/><path d="M12 4v16M5 8l14 8M19 8L5 16" stroke="#16110F" stroke-width="2.5" stroke-linecap="round"/></svg>
      <svg id="hud-fire" hidden class="h-9 w-9" viewBox="0 0 24 24" aria-label="Piment : foncer"><circle cx="12" cy="12" r="11" fill="#FFE3B8" stroke="#16110F" stroke-width="2.5"/><path d="M9 6l7 1c1 6-2 10-6 12-2-4-2-9-1-13z" fill="#E8281E" stroke="#16110F" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </div>
    <button id="btn-pause" type="button" class="btn btn-sun btn-icon pointer-events-auto" aria-label="Pause">
      <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16" stroke="#16110F" stroke-width="5" stroke-linecap="round"/></svg>
    </button>
  </div>
  </div>

  <div id="banner" hidden role="status" class="pointer-events-none absolute inset-x-0 top-24 flex justify-center px-4"></div>
  <p id="hint" hidden class="hint-bob pointer-events-none absolute inset-x-0 top-[58%] text-center text-3xl font-bold text-ink">Tape pour péter !</p>

  <!-- Menu -->
  <section id="menu" class="absolute inset-0 flex flex-col items-center justify-between px-5 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-[max(1.5rem,env(safe-area-inset-top))]" aria-label="Menu">
    <h1 class="logo -rotate-3 pt-4 text-center text-7xl sm:text-8xl">Pouet<br>Panda</h1>
    <div class="flex w-full max-w-sm flex-col items-center gap-4">
      <div class="flex gap-3">
        <div class="chip">Record <span id="menu-best">0</span></div>
        <div class="chip">
          <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#FFD60A" stroke="#16110F" stroke-width="3"/><path d="M12 7v10" stroke="#16110F" stroke-width="3" stroke-linecap="round"/></svg>
          <span id="menu-coins">0</span>
        </div>
      </div>
      <button id="btn-play" type="button" class="btn btn-big w-full">Jouer</button>
      <div class="flex w-full gap-3">
        <button id="btn-shop" type="button" class="btn btn-sun flex-1">Boutique</button>
        <button id="btn-settings" type="button" class="btn btn-cream flex-1">Réglages</button>
      </div>
    </div>
  </section>

  <!-- Pause -->
  <section id="pause" hidden class="absolute inset-0 flex items-center justify-center bg-ink/60 p-5" aria-label="Pause">
    <div class="panel pop flex w-full max-w-xs flex-col gap-4 p-6 text-center">
      <h2 class="text-4xl font-bold">Pause</h2>
      <button id="btn-resume" type="button" class="btn btn-big w-full px-4">Reprendre</button>
      <button id="btn-pause-menu" type="button" class="btn btn-cream w-full">Menu</button>
    </div>
  </section>

  <!-- Fin de partie -->
  <section id="over" hidden class="absolute inset-0 flex items-center justify-center p-5" aria-label="Fin de partie">
    <div class="panel pop flex w-full max-w-sm flex-col gap-4 p-6 text-center">
      <h2 class="text-4xl font-bold">Plof !</h2>
      <p id="over-record" hidden class="mx-auto -rotate-2 rounded-xl border-[3px] border-ink bg-sun px-3 py-1 text-xl font-bold shadow-hard-sm">Nouveau record !</p>
      <div class="flex items-end justify-center gap-6">
        <div><div class="text-lg">Score</div><div id="over-score" class="text-7xl font-bold leading-none">0</div></div>
        <div><div class="text-lg">Record</div><div id="over-best" class="text-4xl font-bold leading-none">0</div></div>
      </div>
      <p class="text-xl font-bold"><span id="over-coins">+0</span> pièces <span id="over-bonus" class="text-lg font-medium"></span></p>
      <button id="btn-again" type="button" class="btn btn-big w-full px-4">Rejouer</button>
      <div class="flex gap-3">
        <button id="btn-over-shop" type="button" class="btn btn-sun flex-1">Boutique</button>
        <button id="btn-over-menu" type="button" class="btn btn-cream flex-1">Menu</button>
      </div>
    </div>
  </section>

  <!-- Boutique -->
  <section id="shop" hidden class="absolute inset-0 flex flex-col bg-sky pt-[max(0.75rem,env(safe-area-inset-top))]" aria-label="Boutique">
    <header class="flex items-center justify-between gap-3 px-3">
      <button id="shop-back" type="button" class="btn btn-cream btn-icon" aria-label="Retour">
        <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4L7 12l8 8" fill="none" stroke="#16110F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="text-3xl font-bold">Boutique</h2>
      <div class="chip">
        <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#FFD60A" stroke="#16110F" stroke-width="3"/><path d="M12 7v10" stroke="#16110F" stroke-width="3" stroke-linecap="round"/></svg>
        <span id="shop-coins">0</span>
      </div>
    </header>
    <canvas id="preview" class="mx-auto mt-2 h-32 w-full max-w-sm shrink-0 touch-none sm:h-40" aria-label="Aperçu du panda équipé" role="img"></canvas>
    <div id="tabs" role="tablist" class="mx-auto flex w-full max-w-3xl gap-1 px-3"></div>
    <div id="grid" role="tabpanel" class="mx-auto min-h-0 w-full max-w-3xl flex-1 touch-pan-y overflow-y-auto border-t-[3px] border-ink bg-cream p-3 pb-[max(1rem,env(safe-area-inset-bottom))] sm:border-x-[3px]"></div>
  </section>

  <!-- Réglages -->
  <section id="settings" hidden class="absolute inset-0 flex items-center justify-center overflow-y-auto bg-sky p-5" aria-label="Réglages">
    <div class="panel pop flex w-full max-w-sm flex-col gap-4 p-6">
      <div class="flex items-center justify-between">
        <h2 class="text-3xl font-bold">Réglages</h2>
        <button id="settings-back" type="button" class="btn btn-sun btn-icon" aria-label="Retour">
          <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="#16110F" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button id="set-sound" type="button" class="btn btn-cream justify-between" aria-pressed="true"><span>Sons</span><span id="set-sound-v">Oui</span></button>
      <button id="set-music" type="button" class="btn btn-cream justify-between" aria-pressed="true"><span>Musique</span><span id="set-music-v">Oui</span></button>
      <div role="radiogroup" aria-labelledby="motion-label" class="flex flex-col gap-2">
        <span id="motion-label" class="text-lg font-bold">Mouvements réduits</span>
        <div class="flex">
          <button type="button" role="radio" class="seg" data-motion="auto" aria-checked="false">Auto</button>
          <button type="button" role="radio" class="seg" data-motion="yes" aria-checked="false">Oui</button>
          <button type="button" role="radio" class="seg" data-motion="no" aria-checked="false">Non</button>
        </div>
      </div>
      <button id="set-reset" type="button" class="btn btn-berry">Effacer ma progression</button>
      <p class="text-center text-base">Pouet Panda, jeu libre (MIT) d'OpenGamingStudio.</p>
    </div>
  </section>

  <div id="toast" hidden role="status" class="pointer-events-none absolute inset-x-0 bottom-4 flex justify-center px-4 pb-[env(safe-area-inset-bottom)]"></div>
</div>
<noscript><p class="p-6 text-2xl font-bold">Pouet Panda a besoin de JavaScript pour voler.</p></noscript>
</body>
</html>
